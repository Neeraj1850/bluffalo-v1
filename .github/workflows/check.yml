# The same gate as .githooks/pre-commit (`make check`): lint, typecheck and tests
# for frontend, backend and contract. Railway waits for this before deploying main.
name: check

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
        working-directory: backend

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/poker

      # Tests never touch the network (CLAUDE.md): no secrets needed here.
      - run: make check

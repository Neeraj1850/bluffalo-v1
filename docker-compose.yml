# Whole stack: docker compose --env-file .env.deploy up --build
# .env.deploy (gitignored) holds POSTGRES_PASSWORD, BACKEND_TOKEN, GROQ_API_KEY,
# NEXT_PUBLIC_PRIVY_APP_ID, PRIVY_APP_SECRET and NEAR_OPERATOR_KEY — see .env.deploy.example.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: near_poker
      POSTGRES_USER: near_poker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U near_poker -d near_poker"]
      interval: 5s
      retries: 10

  # Internal only: no published port; the web app reaches it on the compose network.
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://near_poker:${POSTGRES_PASSWORD}@db:5432/near_poker
      BACKEND_TOKEN: ${BACKEND_TOKEN:?set BACKEND_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID:-}
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_TOKEN: ${BACKEND_TOKEN}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      PRIVY_APP_SECRET: ${PRIVY_APP_SECRET:-}
      NEAR_RPC_URL: ${NEAR_RPC_URL:-https://test.rpc.fastnear.com}
      NEAR_CONTRACT_ID: ${NEAR_CONTRACT_ID:-npoker-43b602.testnet}
      NEAR_OPERATOR_ID: ${NEAR_OPERATOR_ID:-npoker-op-43b602.testnet}
      NEAR_OPERATOR_KEY: ${NEAR_OPERATOR_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
